name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: npm ci --no-audit
      - name: TypeScript build
        run: npm run build
      - name: Frontend tests
        run: npm test
      - name: Prepare sidecar paths for compile-only checks
        run: npm run prepare:sidecars
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Build MCP sidecar
        run: npm run build:mcp-sidecar
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Swift tests
        run: swift test --package-path native/OpenEditorMedia
      - name: Dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
